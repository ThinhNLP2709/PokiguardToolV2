name: Windows CI and draft release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_build:
        description: 'Optional increasing build number; blank uses the Actions run number'
        required: false
        default: ''
      release_tag:
        description: 'New release tag, e.g. v1.3.7 or v1.3.6-build.2'
        required: true

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Offline regression (no game or live input)
        run: python scripts/ci_offline.py
      - name: Build complete Windows bundle
        shell: pwsh
        env:
          RELEASE_BUILD: ${{ inputs.release_build || github.run_number }}
          PYTHONIOENCODING: utf-8
        run: |
          if ($env:RELEASE_BUILD -notmatch '^[1-9][0-9]{0,9}$') { throw 'Invalid build number' }
          ./scripts/build_windows.ps1 -OutputRoot "$env:GITHUB_WORKSPACE/build/ci" -ReleaseBuild ([int]$env:RELEASE_BUILD)
      - name: Test ZIP-extracted EXE
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -LiteralPath build/ci -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected one release ZIP' }
          python scripts/verify_windows_package.py --archive $archive[0].FullName --output "$env:GITHUB_WORKSPACE/temp/reasoning/ci-package-check"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen package checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verified
          path: |
            build/ci/*.zip
            temp/reasoning/ci-package-check/verification.json
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      # Reuse the exact verified ZIP, never rebuild a different release payload.
      - name: Download verified artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name windows-verified --dir build/release
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download verified artifact' }
      - name: Sign and verify release manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY_B64)) { throw 'Configure UPDATE_SIGNING_KEY_B64 before creating a release' }
          $archive = @(Get-ChildItem -LiteralPath build/release -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected one verified release ZIP' }
          python scripts/create_update_manifest.py --archive $archive[0].FullName --tag $env:RELEASE_TAG --output build/release/update.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest signing failed' }
          python scripts/verify_windows_package.py --archive $archive[0].FullName --manifest build/release/update.json --output "$env:GITHUB_WORKSPACE/temp/reasoning/signed-package-check"
          if ($LASTEXITCODE -ne 0) { throw 'Signed package checks failed' }
      - name: Create DRAFT only (maintainer publishes after review)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $archive = @(Get-ChildItem -LiteralPath build/release -Filter '*.zip')
          $flags = @('--draft')
          if ($env:RELEASE_TAG -match '(preview|alpha|beta|rc)') { $flags += '--prerelease' }
          gh release create $env:RELEASE_TAG $archive[0].FullName build/release/update.json @flags --target $env:RELEASE_COMMIT --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; no assets replaced' }
